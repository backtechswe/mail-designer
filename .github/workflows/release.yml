name: Release

# Publishing is deliberately manual. A tag-triggered release means a mistyped tag ships to a
# registry you cannot unship from, and npm's unpublish window is 72 hours.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag
        default: latest

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # write, because this job creates the git tag and the GitHub release as well as
      # publishing. Publishing alone left the Releases section permanently empty, so there was
      # no record in the repository of what any given version contained.
      contents: write
      # This is the credential now. npm trusts this repository and this workflow file to
      # publish the package, and the OIDC token proves the job really is that — so there is no
      # NPM_TOKEN anywhere. It is also what signs the provenance attestation.
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          # 24 rather than 22: trusted publishing needs npm 11.5.1 or newer, and the npm
          # bundled with Node 22 is 10.x. The explicit upgrade below is the actual guarantee —
          # this only starts closer to it.
          node-version: 24
          registry-url: https://registry.npmjs.org
          # No dependency cache in a release build. A cache hit is a chance to publish
          # something other than what a clean install would produce, for a few saved seconds.

      - name: Ensure an npm that can authenticate over OIDC
        run: npm install -g npm@latest

      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Both checks before anything is published, because neither is recoverable afterwards:
      # npm refuses to reuse a version number ever again, even after an unpublish.
      - name: Refuse to republish a version
        run: |
          version="${{ steps.v.outputs.version }}"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "::error::Tag v$version already exists. Bump the version in package.json."
            exit 1
          fi
          if npm view "@backtech/mail-designer@$version" version >/dev/null 2>&1; then
            echo "::error::@backtech/mail-designer@$version is already on npm."
            exit 1
          fi

      - run: npm ci
      - run: npm test

      # No token. npm exchanges the workflow's OIDC identity with the registry, which has
      # been told that this repository and this workflow file may publish this package.
      # Nothing to leak, nothing to rotate, and provenance follows from the same exchange.
      - run: npm publish --provenance --tag ${{ inputs.tag }}

      # After the publish, not before: a tag pointing at a version that never shipped is worse
      # than no tag, because it is the thing people check to find out what shipped.
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.v.outputs.version }}"
          git tag "v$version"
          git push origin "v$version"
          gh release create "v$version" \
            --title "v$version" \
            --generate-notes \
            ${{ inputs.tag != 'latest' && '--prerelease' || '' }}
