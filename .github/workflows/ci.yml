name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is not padding. test/golden/* is committed with `-text` in .gitattributes
        # precisely so the renderer's output is byte-identical across platforms, and that claim
        # has never been checked anywhere but macOS.
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Packaging is sane
        run: |
          npm pack --dry-run
          node -e "import('./dist/render/index.js').then(m => { if (!m.toHtml) throw new Error('render entry is broken'); })"
